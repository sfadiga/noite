name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: build + test + package (Windows, MSVC, Qt 6.10.3)
    runs-on: windows-latest
    env:
      QT_QPA_FONTDIR: C:\Windows\Fonts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/Release

      - name: Test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/run-tests.ps1 -Config Release -QtDir $env:QT_ROOT_DIR

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Release/test-results/

      - name: Deploy (portable folder, size budget)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/deploy.ps1 -Config Release -QtDir $env:QT_ROOT_DIR

      - name: Package self-test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -SelfTest

      - name: Package dry run
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -DryRun

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: noite-dist
          path: |
            dist/noite/**
            build/Release/noite.pdb
          retention-days: 1

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: noite-dist
          path: .

      - name: Package
        shell: powershell
        run: |
          $v = "${{ github.ref_name }}".Substring(1)
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -Version $v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.zip | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Create draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}".Substring(1)
          gh release create "${{ github.ref_name }}" --draft --generate-notes --title "noite $v" "dist/noite-$v-win64.zip" "dist/noite-$v-win64-pdb.zip" "dist/SHA256SUMS.txt"
