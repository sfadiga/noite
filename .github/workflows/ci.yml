name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build + test + package (Windows, MSVC, Qt 6.10.3)
    runs-on: windows-latest
    env:
      QT_QPA_FONTDIR: C:\Windows\Fonts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/Release

      - name: Test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/run-tests.ps1 -Config Release -QtDir $env:QT_ROOT_DIR

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Release/test-results/

      - name: Deploy (portable folder, size budget)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/deploy.ps1 -Config Release -QtDir $env:QT_ROOT_DIR

      - name: Package self-test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -SelfTest

      - name: Package dry run
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -DryRun

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: noite-dist
          if-no-files-found: error
          path: |
            dist/noite/**
            build/Release/noite.pdb
          retention-days: 1

  single-exe:
    name: single exe (static Qt, Windows, MSVC)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Read the pinned static Qt
        id: qt
        shell: powershell
        run: |
          $pin = Get-Content tools/qt-static.json -Raw | ConvertFrom-Json
          "sha256=$($pin.sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "url=$($pin.url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "dir=$env:RUNNER_TEMP\qt-static" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache the static Qt
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\qt-static
          key: qt-static-${{ steps.qt.outputs.sha256 }}

      - name: Download and verify the static Qt
        if: steps.cache.outputs.cache-hit != 'true'
        shell: powershell
        env:
          QT_URL: ${{ steps.qt.outputs.url }}
          QT_SHA256: ${{ steps.qt.outputs.sha256 }}
          QT_DIR: ${{ steps.qt.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'qt-static.zip'
          Invoke-WebRequest -Uri $env:QT_URL -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash
          if ($actual -ne $env:QT_SHA256) {
            throw "static Qt sha256 mismatch: expected $($env:QT_SHA256), got $actual"
          }
          Expand-Archive -Path $zip -DestinationPath $env:QT_DIR -Force
          Remove-Item $zip
          # The zip stores the publisher's local times; make sure nothing looks newer than the build.
          $now = Get-Date
          Get-ChildItem -Path $env:QT_DIR -Recurse -File | ForEach-Object { $_.LastWriteTime = $now }
          if (-not (Test-Path (Join-Path $env:QT_DIR 'lib\cmake\Qt6'))) {
            throw "lib\cmake\Qt6 not found under $($env:QT_DIR)"
          }

      - name: Configure (static)
        shell: pwsh
        run: cmake -S . -B build/Static -G Ninja -DCMAKE_BUILD_TYPE=Release -DNOITE_STATIC=ON "-DCMAKE_PREFIX_PATH=${{ steps.qt.outputs.dir }}"

      - name: Build noite.exe
        run: cmake --build build/Static --target noite

      - name: Package dry run (self-check, dependents, layout)
        timeout-minutes: 10
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -Static -DryRun

      - name: Upload single exe
        uses: actions/upload-artifact@v4
        with:
          name: noite-single-exe
          if-no-files-found: error
          path: |
            dist/dry-run/*.zip
            dist/dry-run/SHA256SUMS.txt
            build/Static/noite.exe
            build/Static/noite.pdb
          retention-days: 7

  release:
    name: draft release
    needs: [build, single-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against version.txt
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}".Substring(1)
          $ver = (Get-Content version.txt -Raw).Trim()
          if ($tag -ne $ver) { throw "tag v$tag ≠ version.txt $ver" }

      - name: Release notes from CHANGELOG.md
        shell: powershell
        run: |
          $v = "${{ github.ref_name }}".Substring(1)
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/changelog-section.ps1 -Version $v -Out notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download the single exe
        uses: actions/download-artifact@v4
        with:
          name: noite-single-exe
          path: .

      - name: Package
        shell: powershell
        run: |
          $v = "${{ github.ref_name }}".Substring(1)
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/package.ps1 -Static -Version $v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.zip | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Create draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}".Substring(1)
          $ErrorActionPreference = 'Continue'
          gh release view "${{ github.ref_name }}" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            Write-Error "release ${{ github.ref_name }} already exists — delete the draft and re-tag"
            exit 1
          }
          gh release create "${{ github.ref_name }}" --draft --notes-file notes.md --title "noite $v" "dist/noite-$v-win64.zip" "dist/noite-$v-win64-pdb.zip" "dist/SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
